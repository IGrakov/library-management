services:
  backend-migration:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env.dev
    environment:
      DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  backend-collectstatic:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env.dev
    environment:
      DATABASE_HOST: postgres

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - .env.dev
    environment:
      DATABASE_HOST: postgres
    command: >
      sh -c "
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      CI: "true"
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "
      corepack enable &&
      pnpm install &&
      pnpm run dev --host 0.0.0.0
      "

  postgres:
    image: postgres:18-alpine3.22
    env_file:
      - .env.dev
    ports:
      - "5434:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: