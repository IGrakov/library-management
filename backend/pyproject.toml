[tool.poetry]
name = "library-management"
version = "0.1.0"
description = "Library management project"
authors = ["Ivan Grakov"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.13"
django = ">=6.0.4,<6.1"
djangorestframework = "^3.17.1"
django-filter = "^25.2"
psycopg = "^3.3.3"
gunicorn = "^25.3.0"
django-cors-headers = "^4.9.0"
drf-spectacular = "^0.29.0"
pillow = "^12.2.0"
redis = "^7.4.0"
django-redis = "^6.0.0"
celery = "^5.6.3"
flower = "^2.0.1"
django-celery-results = "^2.6.0"
django-celery-beat = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-django = "^4.12.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
factory-boy = "^3.3.3"
coverage = {extras = ["toml"], version = "^7.6.7"}
django-silk = "^5.5.0"
pre-commit = "^4.6.0"

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
skip-string-normalization = true
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | htmlcov
    | k8s
    | frontend
    | docker
  )/
)
'''

[tool.coverage.run]
source = ['.']
omit = [
    '*/migrations/*',
    '*/tests/*',
    '*/management/*',
    '*/admin/*',
    '*/admin.py',
    '*/apps.py',
    '*/tests.py',
    '*/factories.py',
    'tasks.py',
    'manage.py',
    'asgi.py',
    'wsgi.py'
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    'def __str__',
    'pragma: no cover',
    'raise AssertionError',
    'raise NotImplementedError',
]
skip_covered = true

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"
