[tool.poetry]
name = "library-management"
version = "0.1.0"
description = "Library management project"
authors = ["Ivan Grakov"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.12"
django = ">=5.2.7,<5.3"
djangorestframework = "^3.16.1"
django-filter = "^25.2"
psycopg = "^3.1"
gunicorn = "^21.2"
django-cors-headers = "^4.4"
drf-spectacular = "^0.28.0"
pillow = "^11.3.0"
redis = "^6.4.0"
django-redis = "^6.0.0"
celery = "^5.5.3"
flower = "^2.0.1"
django-celery-results = "^2.6.0"
django-celery-beat = "^2.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
mock = "^5.2.0"
factory-boy = "^3.3.3"
ddt = "^1.7.2"
coverage = {extras = ["toml"], version = "^7.6.7"}
django-silk = "^5.4.3"
pre-commit = "^4.3.0"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
skip-string-normalization = true
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | htmlcov
    | k8s
    | frontend
    | docker
  )/
)
'''

[tool.coverage.run]
source = ['.']
omit = [
    '*/migrations/*',
    '*/tests/*',
    '*/management/*',
    '*/admin/*',
    '*/admin.py',
    '*/apps.py',
    '*/tests.py',
    '*/factories.py',
    'tasks.py',
    'manage.py',
    'asgi.py',
    'wsgi.py'
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    'def __str__',
    'pragma: no cover',
    'raise AssertionError',
    'raise NotImplementedError',
]
skip_covered = true

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"
