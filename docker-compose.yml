services:
  backend-migration:
    build:
      context: ./backend
    image: library-management-backend
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "python manage.py migrate"
      ]
    restart: on-failure

  backend-collectstatic:
    build:
      context: ./backend
    image: library-management-backend
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "python manage.py collectstatic --noinput"
      ]
    depends_on:
      backend-migration:
        condition: service_completed_successfully
    restart: on-failure
    volumes:
      - staticfiles:/app/staticfiles

  backend:
    build:
      context: ./backend
    image: library-management-backend
    ports:
      - "8001:8000"
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "gunicorn library_management.wsgi:application --bind 0.0.0.0:8000 --workers ${WORKERS:-2}"
      ]
    depends_on:
      backend-collectstatic:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -T 5 -O /dev/null http://localhost:8000/admin/login/ || exit 1"
        ]
      start_period: 5s
      interval: 20s
      timeout: 2s
      retries: 3
    restart: always
    volumes:
      - staticfiles:/app/staticfiles

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    restart: always

volumes:
  staticfiles:
